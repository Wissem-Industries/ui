version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: cron
      cronjob: 10 7 10 * *
      timezone: Europe/Paris
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    groups:
      bun-security:
        applies-to: security-updates
        patterns:
          - '*'
      bun-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
