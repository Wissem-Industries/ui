when:
  - event: tag
    ref: refs/tags/v*
concurrency:
  limit: 1
  group: package-ui

steps:
  - name: deployment-start
    image: oven/bun:alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
      DEPLOYMENT_ENVIRONMENT: package-registry
      DEPLOYMENT_PRODUCTION: "false"
      DEPLOYMENT_TASK: publish:package
    commands:
      - bun .woodpecker/github-deployment.mjs start

  - name: install
    image: oven/bun:alpine
    commands:
      - bun install --frozen-lockfile

  - name: check
    image: oven/bun:alpine
    commands:
      - bun run check
    depends_on:
      - deployment-start
      - install

  - name: publish
    image: oven/bun:alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
    commands:
      - printf '//npm.pkg.github.com/:_authToken=%s\n' "$${GITHUB_PACKAGES_TOKEN}" > /root/.npmrc
      - VERSION=$(bun -p "require('./package.json').version")
      - test "v$${VERSION}" = "$${CI_COMMIT_TAG}"
      - bun publish --ignore-scripts --tolerate-republish
      - rm -f /root/.npmrc
    depends_on:
      - check

  - name: create-release
    image: oven/bun:alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
    commands:
      - bun .woodpecker/github-deployment.mjs release
    depends_on:
      - publish

  - name: deployment-success
    image: oven/bun:alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
      DEPLOYMENT_STATUS_DESCRIPTION: Publication du paquet GitHub Packages terminée
      DEPLOYMENT_URL: https://github.com/orgs/Wissem-Industries/packages/npm/package/ui
    commands:
      - bun .woodpecker/github-deployment.mjs success
    depends_on:
      - create-release

  - name: deployment-failure
    image: oven/bun:alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
      DEPLOYMENT_STATUS_DESCRIPTION: Échec du pipeline de publication
    commands:
      - bun .woodpecker/github-deployment.mjs failure
    when:
      - status: [failure]
